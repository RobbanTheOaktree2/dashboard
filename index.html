<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>

    <link rel="stylesheet" href="style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400..700;1,400..700&family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap" rel="stylesheet">

</head>
<body>
    <div class="grid-container">
        <section id="hem">
            <img src="img/morgonbild.jpg" alt="En vacker soluppgång över en sjö i Sverige." id="morgonbild">
            <h1 id="godmorgon" class="lora-font">God morgon</h1>
            <h2 id="datumtid" class="lora-font">Hämtar datum och tid...</h2>
        </section>

        <section id="citat">
            <p id="citat-text" class="lora-font">Laddar citat...</p>
            <p id="författare" class="lora-font"></p>
        </section>

        <section id="vader_container">
            <section id="vader1">
                <h1 id="vaderdin" class="lora-font"><br>Väder din position</h1>
                <div id=""></div>
            </section>
            <section id="vader2">
                <h1 id="vaderhem" class="lora-font"><br>Väder hem</h1>
            </section>
            <section id="vader3">
                <h1 id="vaderhem2" class="lora-font"><br>Väder hem 2</h1>
            </section>
        </section>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="script.js"></script>

</body>
</html>
